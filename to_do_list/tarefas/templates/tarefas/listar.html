{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="{% static 'tarefas/style.css' %}">
    <meta charset="UTF-8">
    <title>Minhas Tarefas</title>
</head>
<body>
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}    
        {% endif %}
        <h1>Minhas Tarefas</h1>
        <form method='post' action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="btn">Sair</button>
        </form>
        <a href="{% url 'criar_tarefa' %}">Criar Nova Tarefa</a>
        <form method="get" hx-get="/" hx-target="#lista-tarefas" hx-trigger="change" class="filtros">
            <span class="filtros-titulo">Filtros</span>
            <div class="filtro-grupo">
            <label for="status">Status</label>
            <select name="status" id="status">
                <option value="">Todos</option>
                <option value="a_fazer">A Fazer</option>
                <option value="em_andamento">Em Andamento</option>
                <option value="em_revisao">Em Revisão</option>
                <option value="concluida">Concluída</option>
                <option value="cancelada">Cancelada</option>
            </select>
        </div>
        <div class="filtro-grupo">
            <label for="prioridade">Prioridade</label>
            <select name="prioridade" id="prioridade">
                <option value="">Todas</option>
                <option value="baixa">Baixa</option>
                <option value="media">Média</option>
                <option value="alta">Alta</option>
            </select>
        </div>
        <div class="filtro-grupo">
            <label for="prazo">Prazo:</label>
            <input type="date" name="prazo" id="prazo">
        <div class="filtro-grupo">
            <label for="busca">Buscar</label>
            <input type="text" name="busca" id="busca" placeholder="Titulo ou descrição">
        </div>
        </form>
        <div id="lista-tarefas">
            {% include 'tarefas/_lista_tarefas.html' %}
        </div>
    </div>
</body>
</html>
