{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Tarefa</title>
    <link rel="stylesheet" type="text/css" href="{% static 'tarefas/style.css' %}">
</head>
<body>
    <div class="container-form">
        <h1>Detalhes da Tarefa</h1>
        <div class="tarefa-card">
            <h3>{{ tarefa.titulo }}</h3>
            <p class="tarefa-descricao">{{ tarefa.descricao }}</p>
            <p><strong>Status:</strong> {{ tarefa.get_status_display }}</p>
            <p><strong>Prioridade:</strong> {{ tarefa.get_prioridade_display }}</p>
            <p><strong>Prazo:</strong> {{ tarefa.prazo|date:"d/m/Y" }}</p>
            <p><strong>Responsável:</strong> {{ tarefa.usuario }}</p>
            <div class="tarefa-acoes">
                <a href="{% url 'editar_tarefa' tarefa.id %}" class="btn">Editar</a>
        </div>
    </div>
        <a href="{% url 'kanban_tarefas' %}" class="btn">Voltar para o Kanban</a>
    </div>
    </body>
    </html>
