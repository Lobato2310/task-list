{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="stylesheet" href="{% static 'tarefas/style.css' %}">
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <div class="container-form">
        <h1>Login</h1>
        <p>Não tem uma conta? <a href="{% url 'cadastrar_usuario' %}">Cadastre-se</a></p>
        <a href="{% url 'password_reset' %}">Esqueceu sua senha?</a>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn-submit" type="submit">Entrar</button>
        </form>
    </div>
</body>
</html>
